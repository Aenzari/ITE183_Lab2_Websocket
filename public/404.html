<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 · Page not found</title>
  <style>
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: #f4f6f8; color: #17212b; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-align: center; }
    main { max-width: 440px; }
    .code { margin: 0; color: #526477; font-size: .8rem; font-weight: 700; letter-spacing: .14em; }
    h1 { margin: 12px 0; font-size: clamp(2rem, 8vw, 3.5rem); letter-spacing: -.05em; }
    p { color: #526477; line-height: 1.6; }
    a { display: inline-block; margin-top: 12px; padding: 11px 16px; border-radius: 8px; background: #203d59; color: #fff; text-decoration: none; font-weight: 650; }
    a:hover { background: #2c5275; }
  </style>
</head>
<body>
  <main>
    <p class="code">ERROR 404</p>
    <h1>Page not found</h1>
    <p>The requested page is not available on this server. Return to the chat room to continue.</p>
    <a href="/">Back to chat</a>
  </main>
</body>
</html>
